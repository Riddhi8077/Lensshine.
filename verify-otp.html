<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <style>
        /* Add your styles from earlier */
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Verify OTP</h1>
        <form id="otpForm">
            <div class="form-group">
                <label>Enter 6-digit OTP sent to <span id="phoneDisplay"></span></label>
                <input type="text" id="otp" maxlength="6" pattern="\d{6}" required>
            </div>
            <button type="submit" class="submit-btn">Verify</button>
        </form>
    </div>

    <script>
        // 1. Display phone number
        const urlParams = new URLSearchParams(window.location.search);
        const phone = urlParams.get('phone');
        document.getElementById('phoneDisplay').textContent = phone;

        // 2. OTP verification
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp = document.getElementById('otp').value;
            const formData = JSON.parse(sessionStorage.getItem('tempSignupData'));

            try {
                // In production: Verify OTP with your backend
                console.log(`[DEBUG] Verifying OTP ${otp} for ${phone}`);
                
                // Mock verification for development
                if (otp === '123456') {
                    alert('OTP verified successfully!');
                    // Proceed with registration
                    window.location.href = 'login.html';
                } else {
                    throw new Error('Invalid OTP');
                }
                
            } catch (error) {
                alert(error.message || 'Verification failed');
            }
        });
    </script>
</body>
</html>
