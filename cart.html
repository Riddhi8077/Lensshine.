<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - GoEye Clone</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/Logo Img.png" alt="Lensshine Logo">
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#">Eyeglasses</a></li>
        <li><a href="#">Sunglasses</a></li>
        <li><a href="#">Contact Lenses</a></li>
        <li><a href="#">Blog</a></li>
      </ul>
    </nav>
    <div class="icons">
      <a href="#"><i class="fas fa-search"></i></a>
      <a href="#"><i class="fas fa-user"></i></a>
      <a href="cart.html"><i class="fas fa-shopping-cart"></i> <span class="cart-count">0</span></a>
    </div>
  </header>

  <section class="cart">
    <h2>Shopping Cart</h2>
    <div class="cart-items">
      <!-- Cart items will be dynamically added here -->
    </div>
    <div class="cart-total">
      <p>Total: <span id="total-price">$0.00</span></p>
      <button>Proceed to Checkout</button>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h3>About Us</h3>
        <p>We provide high-quality eyewear for every occasion.</p>
      </div>
      <div class="footer-section">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#">Eyeglasses</a></li>
          <li><a href="#">Sunglasses</a></li>
          <li><a href="#">Contact Lenses</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2023 Lensshine. All rights reserved.</p>
    </div>
  </footer>

  <script src="scripts/script.js"></script>
</body>
</html>
