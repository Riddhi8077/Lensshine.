<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="styles/account.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-user-circle"></i>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your account</p>
      </div>
      
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <i class="fas fa-eye password-toggle"></i>
        </div>
        
        <div class="login-actions">
          <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <button type="submit" class="login-btn">Sign In</button>
      </form>
      
      <div class="social-login">
        <div class="social-divider">Or continue with</div>
        <div class="social-buttons">
          <button class="social-btn google"><i class="fab fa-google"></i></button>
          <button class="social-btn facebook"><i class="fab fa-facebook-f"></i></button>
          <button class="social-btn twitter"><i class="fab fa-twitter"></i></button>
        </div>
      </div>
      
      <div class="login-footer">
        <div class="signup-prompt">
          <p>New User? <a href="/signup"><strong>Sign Up</strong></a></p>
      </div></div>
    </div>
  </div>
  
  <script src="scripts/account.js"></script>
</body>
</html>
